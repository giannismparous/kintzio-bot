<!DOCTYPE html>
<!--
  Chat page — re-skinned from the BPAN app's templates/ms_support.html.
  Kept from that file: the single-file structure (no build step), the JS i18n
  dictionary keyed by language with a toggle, the citation footnote rendering,
  and the fetch-then-append message loop.
  Changed: palette, copy, the AI-disclosure banner is persistent rather than a
  footer note (EU AI Act Art. 50 — see services/guardrails.py), and the lead
  flow is driven by /api/leads/flows instead of a static form.
-->
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Kitsi — {{ org_name }}</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<style>
  :root{
    --ink:#070f45; --ink-soft:#5b6470; --line:#e8eaf0; --bg:#fbfbfc;
    /* His own palette, lifted from kkintzios.com — not chosen by us. */
    --accent:#ff7d00;        /* the orange in his logo and CTAs */
    --accent-dark:#d96a00;   /* darkened for hover/AA text contrast */
    --accent-wash:#fff4e8;
    --bubble-user:#070f45; --bubble-bot:#ffffff;
    --warn-bg:#fff8ec; --warn-line:#e8d5a8;
    --shadow:0 1px 2px rgba(7,15,69,.04), 0 8px 24px -12px rgba(7,15,69,.14);
    --shadow-lift:0 2px 4px rgba(7,15,69,.06), 0 16px 32px -16px rgba(7,15,69,.22);
  }
  *{box-sizing:border-box}
  body{margin:0;font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       color:var(--ink);
       /* Navy wash top-left, warm wash top-right: his two brand colours at
          2-3% so the page reads as his without competing with the content. */
       background:
         radial-gradient(1100px 520px at 12% -8%, #eef1f8 0%, transparent 60%),
         radial-gradient(900px 460px at 88% -12%, var(--accent-wash) 0%, transparent 62%),
         var(--bg);
       background-attachment:fixed;
       -webkit-font-smoothing:antialiased}
  header{background:rgba(255,255,255,.82);backdrop-filter:saturate(1.6) blur(14px);
         -webkit-backdrop-filter:saturate(1.6) blur(14px);
         border-bottom:1px solid var(--line);padding:13px 20px;position:sticky;top:0;z-index:5}
  .hwrap{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:14px}
  .hname{font-weight:700;letter-spacing:-.3px;font-size:16.5px}
  .hsub{color:var(--ink-soft);font-size:13px}
  .brand{display:flex;align-items:center;gap:11px}
  .avatar{border-radius:50%;flex:0 0 auto;display:block}
  /* Bot messages carry the mark too, so a screenshot of one answer still shows
     who is speaking — an AI-disclosure concern, not decoration. */
  .msg.bot .who{display:flex;align-items:center;gap:6px}
  .msg.bot .who::before{content:"";width:15px;height:15px;border-radius:50%;
      background:url(/static/kitsi-avatar-plain.svg) center/cover;flex:0 0 auto}
  .langbtn{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:999px;
           padding:6px 14px;cursor:pointer;font-size:13px;font-weight:600;color:var(--ink-soft)}
  .langbtn:hover{border-color:var(--accent);color:var(--accent-dark)}

  /* AI Act Art. 50 — persistent, not dismissible. */
  .disclose{background:var(--warn-bg);border-bottom:1px solid var(--warn-line);
            font-size:13px;color:#6b5628;padding:9px 20px;text-align:center}

  main{max-width:820px;margin:0 auto;padding:22px 20px 140px}
  .msg{margin:16px 0;display:flex;gap:10px}
  .msg .who{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);margin-bottom:5px}
  .bub{padding:14px 17px;border-radius:16px;max-width:88%;
       animation:rise .34s cubic-bezier(.2,.7,.3,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
  .bot .bub{background:var(--bubble-bot);border:1px solid var(--line);
            box-shadow:var(--shadow);border-top-left-radius:5px}
  .user{justify-content:flex-end}
  .user .bub{background:var(--bubble-user);color:#fff;border-top-right-radius:5px;
             box-shadow:0 10px 22px -14px rgba(7,15,69,.55)}
  .bub ul{margin:.5em 0;padding-left:1.15em}
  .bub sup a{text-decoration:none}
  .bub ol{font-size:13.5px;color:var(--ink-soft)}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 4px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 15px;
        box-shadow:var(--shadow);transition:transform .16s cubic-bezier(.2,.7,.3,1),border-color .16s,box-shadow .16s;
        font-size:13.5px;cursor:pointer;color:var(--ink-soft)}
  .chip:hover{border-color:var(--accent);color:var(--accent-dark)}

  /* Fade the page out under the composer instead of a hard border line. */
  footer{position:fixed;bottom:0;left:0;right:0;padding:14px 20px 18px;
         background:linear-gradient(to top,var(--bg) 62%,rgba(251,251,252,0));
         border-top:0}
  .fwrap{max-width:820px;margin:0 auto;display:flex;gap:10px}
  #q{flex:1;padding:14px 16px;border:1px solid var(--line);border-radius:13px;font:inherit;
     outline:none;background:#fff;transition:border-color .16s,box-shadow .16s}
  #q:focus{border-color:var(--accent)}
  /* Send wears his orange: it is the call to action on his own page. */
  #send{background:var(--accent);color:#fff;border:0;border-radius:13px;padding:0 24px;
        font-weight:700;cursor:pointer;letter-spacing:.01em}
  #send:disabled{opacity:.45;cursor:default}
  .foot-note{max-width:820px;margin:8px auto 0;font-size:11.5px;color:var(--ink-soft);text-align:center}
  .dots span{display:inline-block;width:6px;height:6px;margin:0 2px;border-radius:50%;
             background:var(--ink-soft);animation:b 1.2s infinite}
  .dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
  @keyframes b{0%,60%,100%{opacity:.25}30%{opacity:1}}

  /* Agent trace — the model's own tool choices, shown as they happened. */
  .trace{max-width:820px;margin:2px auto 10px;padding:10px 14px;
    border-left:2px solid var(--accent);background:#fff8f1;border-radius:0 8px 8px 0}
  .trace-h{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
    color:var(--accent-dark);font-weight:700;margin-bottom:7px}
  .trace-s{display:flex;align-items:center;gap:9px;padding:3px 0;font-size:12.5px;
    color:var(--ink-soft);opacity:0;animation:tin .32s ease forwards}
  .trace-d{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none}
  .trace-t{flex:1}
  .trace-t i{color:var(--ink);font-style:normal;opacity:.75}
  .trace-n{font-size:11px;font-weight:700;color:#fff;background:var(--accent);
    border-radius:999px;padding:1px 7px;min-width:18px;text-align:center}
  @keyframes tin{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
  .ground{max-width:820px;margin:-4px auto 12px;font-size:11.5px;padding:5px 12px;
    border-radius:999px;display:table}
  .ground.ok{color:#0f6b3f;background:#e8f6ee}
  .ground.warn{color:#8a4b00;background:#fff1e0;font-weight:600}

  /* Source provenance cards */
  .srcs{max-width:820px;margin:2px auto 16px}
  .srcs-h{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
    color:#8a919e;font-weight:700;margin:0 0 7px 2px}
  .srcs-r{display:flex;flex-wrap:wrap;gap:8px}
  .srcs-c{display:flex;align-items:center;gap:8px;text-decoration:none;
    border:1px solid var(--line);background:#fff;border-radius:10px;
    padding:7px 11px;font-size:12.5px;color:var(--ink);max-width:100%;
    transition:border-color .15s,transform .15s}
  a.srcs-c:hover{border-color:var(--accent);transform:translateY(-1px)}
  .srcs-n{font-size:10.5px;font-weight:700;color:var(--accent);
    border:1.5px solid var(--accent);border-radius:50%;width:17px;height:17px;
    display:grid;place-items:center;flex:none}
  .srcs-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:290px}
  .srcs-k{font-size:10px;color:#8a919e;background:#f2f3f5;border-radius:4px;padding:1px 5px}
  .stage{color:var(--ink-soft);font-size:13.5px;animation:fade .4s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}

  .chip:hover{transform:translateY(-2px);border-color:var(--accent);
    box-shadow:var(--shadow-lift);color:var(--accent-dark)}

  /* Composer: floating card rather than a bar welded to the viewport edge. */
  .composer{background:rgba(255,255,255,.9);backdrop-filter:blur(14px) saturate(1.6);
    -webkit-backdrop-filter:blur(14px) saturate(1.6);
    border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lift)}
  #q:focus{outline:none;border-color:var(--accent);
    box-shadow:0 0 0 4px rgba(255,125,0,.13)}
  #send{transition:transform .16s,box-shadow .16s,background .16s}
  #send:hover:not(:disabled){transform:translateY(-1px);
    box-shadow:0 8px 18px -8px rgba(255,125,0,.7)}
  #send:disabled{opacity:.45;cursor:not-allowed}

  /* Trace: the orange rail gets a soft glow so it reads as "live". */
  .trace{box-shadow:0 1px 2px rgba(255,125,0,.06)}
  .trace-n{box-shadow:0 2px 6px -2px rgba(255,125,0,.6)}

  @media (max-width:640px){
    .bub{max-width:94%}
    main{padding:16px 14px 150px}
    .srcs-t{max-width:180px}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="brand">
      <img src="/static/kitsi-avatar.svg" alt="" width="40" height="40" class="avatar">
      <div>
        <div class="hname" id="t-name">Κίτσι</div>
        <div class="hsub" id="t-role"></div>
      </div>
    </div>
    <button class="langbtn" id="langbtn" onclick="toggleLang()">EN</button>
  </div>
</header>
<div class="disclose" id="t-disclose"></div>

<main id="log"></main>

<footer>
  <div class="fwrap">
    <input id="q" autocomplete="off">
    <button id="send" onclick="ask()"></button>
  </div>
  <div class="foot-note" id="t-foot"></div>
</footer>

<script>
/* --- i18n. Same pattern as the BPAN app: one dict, keys applied on switch. --- */
const I18N = {
  el: {
    role: "Business Mentor · Leadership Coach · Public Speaker",
    disclose: "Μιλάς με ψηφιακό βοηθό (AI), όχι με τον Κωνσταντίνο. Απαντά μόνο από το δημοσιευμένο υλικό του και δείχνει τις πηγές.",
    placeholder: "Ρώτησε για ηγεσία, ομάδες, καριέρα…",
    send: "Στείλε",
    foot: "Οι απαντήσεις προέρχονται από δημοσιευμένο υλικό. Δεν αντικαθιστούν ιατρική, νομική ή οικονομική συμβουλή.",
    welcome: "<p>Είμαι το <b>Κίτσι</b>, ο ψηφιακός βοηθός του Κωνσταντίνου Κιντζιού. Απαντώ <b>μόνο</b> από αυτά που έχει πει και γράψει ο ίδιος — και σου δείχνω πού.</p><p>Ρώτησέ με για ηγεσία, ομάδες, εργασιακή κουλτούρα, Gen Z, καριέρα. Ή πες μου τι πρόβλημα έχεις και θα σου βρω τον θεματικό πυλώνα που ταιριάζει.</p>",
    stages: ["Σκέφτομαι…","Ψάχνω στο υλικό του…","Διασταυρώνω τις πηγές…","Γράφω την απάντηση…"],
    chips: ["Πώς διοικώ μια ομάδα με Gen Z;","Οι νέοι μας φεύγουν στον πρώτο χρόνο","Θέλω keynote για το συνέδριό μας","Ποιος είναι ο Κωνσταντίνος;"],
    name: "Κίτσι", you: "Εσύ", bot: "Κίτσι",
    err: "Κάτι πήγε λάθος. Δοκίμασε ξανά."
  },
  en: {
    role: "Business Mentor · Leadership Coach · Public Speaker",
    disclose: "You're talking to Kitsi, a digital assistant (AI), not Konstantinos. It answers only from his published material and shows its sources.",
    placeholder: "Ask about leadership, teams, careers…",
    send: "Send",
    foot: "Answers come from published material. They do not replace medical, legal or financial advice.",
    welcome: "<p>I'm <b>Kitsi</b>, Konstantinos Kintzios's digital assistant. I answer <b>only</b> from what he has actually said and written — and I show you where.</p><p>Ask me about leadership, teams, workplace culture, Gen Z, careers. Or tell me your problem and I'll find the thematic pillar that fits.</p>",
    stages: ["Thinking…","Searching his material…","Cross-checking sources…","Writing the answer…"],
    chips: ["How do I manage a Gen Z team?","Our graduates leave within a year","I want a keynote for our conference","Who is Konstantinos?"],
    name: "Kitsi", you: "You", bot: "Kitsi",
    err: "Something went wrong. Please try again."
  }
};

let LANG = (navigator.language || "el").toLowerCase().startsWith("el") ? "el" : "en";
let SESSION = localStorage.getItem("kz_session") || (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()));
localStorage.setItem("kz_session", SESSION);

function applyLang(){
  const t = I18N[LANG];
  document.documentElement.lang = LANG;
  document.getElementById("t-name").textContent = t.name;
  document.getElementById("t-role").textContent = t.role;
  document.getElementById("t-disclose").textContent = t.disclose;
  document.getElementById("q").placeholder = t.placeholder;
  document.getElementById("send").textContent = t.send;
  document.getElementById("t-foot").textContent = t.foot;
  document.getElementById("langbtn").textContent = LANG === "el" ? "EN" : "ΕΛ";
  document.getElementById("log").innerHTML = "";
  bot(t.welcome);
  chips(t.chips);
}
function toggleLang(){ LANG = LANG === "el" ? "en" : "el"; applyLang(); }

function esc(s){ return s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

function bot(html, id){
  const d = document.createElement("div");
  d.className = "msg bot";
  if (id) d.id = id;
  d.innerHTML = `<div><div class="who">${I18N[LANG].bot}</div><div class="bub">${html}</div></div>`;
  document.getElementById("log").appendChild(d);
  window.scrollTo(0, document.body.scrollHeight);
  return d;
}
function user(text){
  const d = document.createElement("div");
  d.className = "msg user";
  d.innerHTML = `<div><div class="who" style="text-align:right">${I18N[LANG].you}</div><div class="bub">${esc(text)}</div></div>`;
  document.getElementById("log").appendChild(d);
  window.scrollTo(0, document.body.scrollHeight);
}
function chips(list){
  const w = document.createElement("div");
  w.className = "chips";
  list.forEach(c => {
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = c;
    b.onclick = () => { document.getElementById("q").value = c; ask(); };
    w.appendChild(b);
  });
  document.getElementById("log").appendChild(w);
}

// --- Agent trace ----------------------------------------------------------
// Shows WHICH tools the model chose and what each returned. This is not
// decoration: the product's whole claim is that answers come from his real
// material under a rights filter, and a visible trace is what makes that claim
// checkable rather than a promise in the footer. A spinner hides exactly the
// thing worth showing.
const TOOL_LABEL = {
  el: {search_corpus:"Αναζήτηση στο υλικό του", match_pillars:"Αντιστοίχιση θεματικών πυλώνων",
       start_lead_flow:"Έναρξη αιτήματος συνεργασίας"},
  en: {search_corpus:"Searching his material", match_pillars:"Matching keynote pillars",
       start_lead_flow:"Starting an enquiry"}
};
function renderTrace(trace){
  const wrap = document.createElement("div");
  wrap.className = "trace";
  const hdr = LANG === "el" ? "Τι έκανε" : "What it did";
  wrap.innerHTML = `<div class="trace-h">${hdr}</div>` + trace.map((s,i) => {
    const label = (TOOL_LABEL[LANG]||TOOL_LABEL.en)[s.tool] || s.tool;
    const arg = Object.values(s.args||{})[0] || "";
    const n = s.n_results;
    const nTxt = (n === undefined || n === null) ? ""
      : `<span class="trace-n">${n}</span>`;
    return `<div class="trace-s" style="animation-delay:${i*90}ms">
        <span class="trace-d"></span>
        <span class="trace-t">${esc(label)}${arg ? ` · <i>${esc(String(arg).slice(0,60))}</i>` : ""}</span>
        ${nTxt}
      </div>`;
  }).join("");
  document.getElementById("log").appendChild(wrap);
  wrap.scrollIntoView({behavior:"smooth", block:"end"});
}

// --- Grounding badge ------------------------------------------------------
// `removed > 0` means the verifier DELETED an unverifiable quote from the
// answer the visitor is reading. That is the safety mechanism firing, and
// hiding it would waste the most persuasive thing this app does.
function renderGrounding(g){
  if (!g || !g.checked) return;
  const ok = g.removed === 0;
  const el = document.createElement("div");
  el.className = "ground " + (ok ? "ok" : "warn");
  el.textContent = ok
    ? (LANG === "el" ? `✓ ${g.grounded}/${g.checked} αποσπάσματα επαληθεύτηκαν στις πηγές`
                     : `✓ ${g.grounded}/${g.checked} quotes verified against sources`)
    : (LANG === "el" ? `${g.removed} μη επαληθεύσιμο απόσπασμα αφαιρέθηκε`
                     : `${g.removed} unverifiable quote removed`);
  document.getElementById("log").appendChild(el);
}

// --- Source cards ---------------------------------------------------------
// The API deliberately ships titles and URLs but NOT chunk text (shipping the
// text would make the corpus scrapeable one question at a time). So the cards
// show provenance and link out; they are not a reading surface.
function renderSources(sources){
  if (!sources || !sources.length) return;
  const wrap = document.createElement("div");
  wrap.className = "srcs";
  const hdr = LANG === "el" ? "Από πού το πήρε" : "Where this came from";
  wrap.innerHTML = `<div class="srcs-h">${hdr}</div><div class="srcs-r">` +
    sources.map((s,i) => {
      const title = esc(s.title || s.url || "—");
      const kind = esc(s.source_type || "");
      const body = `<span class="srcs-n">${i+1}</span>
          <span class="srcs-t">${title}</span>
          ${kind ? `<span class="srcs-k">${kind}</span>` : ""}`;
      return s.url
        ? `<a class="srcs-c" href="${esc(s.url)}" target="_blank" rel="noopener">${body}</a>`
        : `<div class="srcs-c">${body}</div>`;
    }).join("") + "</div>";
  document.getElementById("log").appendChild(wrap);
}

async function ask(){
  const inp = document.getElementById("q");
  const q = inp.value.trim();
  if (!q) return;
  inp.value = "";
  document.querySelectorAll(".chips").forEach(e => e.remove());
  user(q);
  const btn = document.getElementById("send"); btn.disabled = true;
  // Staged status instead of a bare spinner. The agent really does take a
  // few seconds when it calls two tools, and naming the stage is both honest
  // and the most interesting thing on screen.
  const pending = bot('<span class="dots"><span></span><span></span><span></span></span>');
  const stages = I18N[LANG].stages;
  let si = 0;
  const ticker = setInterval(() => {
    si = Math.min(si + 1, stages.length - 1);
    const b = pending.querySelector(".bub");
    if (b) b.innerHTML = `<span class="stage">${stages[si]}</span>`;
  }, 1100);
  try{
    const res = await fetch("/api/ask", {
      method: "POST", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({question: q, session_id: SESSION, lang: LANG})
    });
    const data = await res.json();
    clearInterval(ticker);
    pending.remove();
    if (data.trace && data.trace.length) renderTrace(data.trace);
    bot(data.answer || I18N[LANG].err);
    if (data.grounding) renderGrounding(data.grounding);
    renderSources(data.sources);
  }catch(e){
    clearInterval(ticker);
    pending.remove();
    bot(I18N[LANG].err);
  }finally{
    btn.disabled = false; inp.focus();
  }
}
document.getElementById("q").addEventListener("keydown", e => { if (e.key === "Enter") ask(); });
applyLang();
</script>
</body>
</html>
