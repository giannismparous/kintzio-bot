services:
  - type: web
    name: kintzio-bot
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_MODE
        value: dev
      - key: STORAGE_MODE
        value: local
      - key: API_HOST
        value: 0.0.0.0
      - key: STATIC_BOT_BUNDLE
        value: data/kintzio-bundle.json
      - key: DISABLE_BROWSER_RENDER
        value: "true"
      - key: GEMINI_EMBED_MODEL
        value: gemini-embedding-001
      - key: GEMINI_CHAT_MODEL
        value: gemini-flash-lite-latest
      - key: GEMINI_EMBED_DIMS
        value: "768"
      - key: GEMINI_API_KEY
        sync: false
